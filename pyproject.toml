[tool.basedpyright]
include = ["src", "scripts", "main.py", "tests"]
exclude = ["**/__pycache__", ".venv", "venv"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
# Prefer catching breakage of annotated APIs over stub noise from OpenCV / numpy.
reportMissingImports = true
reportUnusedImport = true
reportUnusedVariable = true

[tool.ruff]
target-version = "py310"
src = ["src", "scripts", "tests"]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py", "main.py"]

[tool.ruff.lint]
# Centered on unused imports / variables. autofix is F401.
select = ["F401", "F841"]

[tool.vulture]
paths = ["src", "scripts", "main.py", "tests"]
min_confidence = 80
exclude = [".venv/", "venv/", "**/__pycache__/"]
